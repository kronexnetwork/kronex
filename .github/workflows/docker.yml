# Builds ghcr.io/kronexnetwork/krnxd from the archives of a release. The
# Dockerfile downloads and verifies them itself; this workflow only picks the
# release, names the image and pushes it for linux/amd64 and linux/arm64.
#
# A published release builds and pushes its own tag. A manual run does the same
# for any existing release. A pull request that touches the Dockerfile or this
# file builds the latest release without pushing, to prove the build still works.

name: Docker image

on:
  release:
    types: [published]
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.0.0-testnet.1
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$EVENT" in
            release) tag="$RELEASE_TAG" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            *) tag="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[0].tag_name')" ;;
          esac
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release tag is always an image tag. "testnet" follows the latest
      # testnet pre-release, "latest" the latest final release.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/kronexnetwork/krnxd
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=testnet,enable=${{ contains(steps.release.outputs.tag, '-testnet.') }}
            type=raw,value=latest,enable=${{ !contains(steps.release.outputs.tag, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ steps.release.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
